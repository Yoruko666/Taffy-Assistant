# Taffy Server 配置
# Server 是系统中枢：负责接收家具端 / 客户端的请求，转发给 Worker（大模型编排），
# 自身不直接接 ASR / LLM / TTS。
#
# 大模型相关配置（API URL、API Key、模型名等）请在 ../worker/config.yaml 中配置。

# Worker（大模型编排进程）地址
worker:
  # Worker 的 /v1/orchestrate WS 端点，Server 在每条家具会话中拨号到此 URL
  ws_url: "ws://127.0.0.1:8090/v1/orchestrate"

# MySQL 数据库
mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  dbname: "taffy"
  # 连接池参数
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: "5m"  # 5 分钟

# Redis 缓存
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# JWT 鉴权
jwt:
  secret: "change-me-in-production"
  access_ttl: "2h"   # Access Token 有效期
  refresh_ttl: "168h" # Refresh Token 有效期（7 天）
